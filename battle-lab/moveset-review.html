<!doctype html><meta charset="utf-8"><style>body{background:#11202e;color:white;font:14px system-ui;margin:10px}canvas{display:block;width:100%;image-rendering:pixelated}</style><canvas id="sheet" width="1100" height="1700"></canvas><script type="module">const d=await(await fetch('spiderman.json')).json(),im=new Image();im.src='spiderman.png';await im.decode();const c=document.querySelector('canvas').getContext('2d');c.imageSmoothingEnabled=false;const names=['Attack1','Attack2','Attack3','Attack4','Attackcharged','Attacksprinting','Attackswinging','Attackair','Power1','Power2','Special','Webswing'];for(let row=0;row<names.length;row++){const name=names[row],frames=d.hero.clips[name].frames;c.fillStyle='#1b3446';c.fillRect(0,row*140,1100,138);c.fillStyle='white';c.font='17px monospace';c.fillText(name,10,row*140+25);for(let k=0;k<4;k++){const f=frames[Math.floor((frames.length-1)*k/3)],[x,y,w,h]=f.rect,[ox,oy]=f.pos;c.drawImage(im,x,y,w,h,200+k*225+ox*1.2,row*140+125+oy*1.2,w*1.2,h*1.2);}}</script>
