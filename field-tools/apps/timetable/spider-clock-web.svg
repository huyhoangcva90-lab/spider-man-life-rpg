<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bezel" x1="86" y1="90" x2="437" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0f4f8"/>
      <stop offset=".18" stop-color="#202936"/>
      <stop offset=".43" stop-color="#080b11"/>
      <stop offset=".72" stop-color="#657383"/>
      <stop offset="1" stop-color="#0a111b"/>
    </linearGradient>
    <linearGradient id="red-rim" x1="110" y1="110" x2="408" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b60816"/>
      <stop offset=".45" stop-color="#ff3646"/>
