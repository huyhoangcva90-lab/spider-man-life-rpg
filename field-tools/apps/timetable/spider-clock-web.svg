  <circle cx="260" cy="260" r="202" stroke="url(#red-rim)" stroke-width="5"/>
  <circle cx="260" cy="260" r="223" stroke="#dfe8ef" stroke-width="1.5" opacity=".85"/>
  <circle cx="260" cy="260" r="192" stroke="#f43a47" stroke-width="1" opacity=".72"/>
  <g stroke="#f5f8fb" opacity=".89">
