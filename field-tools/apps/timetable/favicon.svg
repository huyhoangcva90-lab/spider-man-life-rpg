<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e24"/>
      <stop offset="100%" stop-color="#06040d"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#b4a9fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#bg)"/>
  <rect width="124" height="124" x="2" y="2" rx="30" fill="none" stroke="url(#purple)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- 24h Radial Clock Grid -->
  <g transform="translate(64, 64)">
    <circle r="36" fill="none" stroke="url(#purple)" stroke-width="5"/>
    <circle r="24" fill="none" stroke="url(#purple)" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.5"/>
    <circle r="6" fill="url(#purple)"/>

    <!-- Dynamic 24h hands -->
    <path d="M 0 0 L -14 -20 M 0 0 L 18 12" stroke="url(#purple)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Hour notches -->
    <circle cx="0" cy="-36" r="3" fill="url(#purple)"/>
    <circle cx="36" cy="0" r="3" fill="url(#purple)"/>
    <circle cx="0" cy="36" r="3" fill="url(#purple)"/>
    <circle cx="-36" cy="0" r="3" fill="url(#purple)"/>
  </g>
</svg>
