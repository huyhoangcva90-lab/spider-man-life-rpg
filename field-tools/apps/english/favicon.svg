<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a17"/>
      <stop offset="100%" stop-color="#0b0308"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#bg)"/>
  <rect width="124" height="124" x="2" y="2" rx="30" fill="none" stroke="url(#pink)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Open Book & Az Text -->
  <g transform="translate(64, 64)">
    <path d="M 0 -10 C -16 -22, -36 -18, -40 -16 L -40 24 C -36 22, -16 18, 0 30 C 16 18, 36 22, 40 24 L 40 -16 C 36 -18, 16 -22, 0 -10 Z" 
          fill="none" stroke="url(#pink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-10" x2="0" y2="30" stroke="url(#pink)" stroke-width="6" stroke-linecap="round"/>

    <!-- 'A' Alphabet Emblem -->
    <path d="M -22 8 L -14 -12 L -6 8 M -19 2 L -9 2" stroke="url(#pink)" stroke-width="4" stroke-linecap="round"/>
    <!-- 'z' Alphabet Emblem -->
    <path d="M 8 -10 L 22 -10 L 8 8 L 22 8" fill="none" stroke="url(#pink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
