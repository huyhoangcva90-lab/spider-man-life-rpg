<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c160c"/>
      <stop offset="100%" stop-color="#0a0703"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#bg)"/>
  <rect width="124" height="124" x="2" y="2" rx="30" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Coat Hanger & Tie -->
  <g transform="translate(64, 64)">
    <!-- Hook -->
    <path d="M 0 -14 C 0 -26, 12 -26, 12 -18 C 12 -12, 0 -10, 0 0" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <!-- Hanger Triangle -->
    <path d="M 0 0 L -36 24 C -36 28, 36 28, 36 24 Z" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Fashion Tie -->
    <polygon points="0,4 6,12 4,32 0,38 -4,32 -6,12" fill="url(#gold)"/>
  </g>
</svg>
