<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18120a"/>
      <stop offset="100%" stop-color="#090603"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb340"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#bg)"/>
  <rect width="124" height="124" x="2" y="2" rx="30" fill="none" stroke="url(#amber)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Sun Rays & Clock Ring -->
  <g transform="translate(64, 64)">
    <circle r="26" fill="none" stroke="url(#amber)" stroke-width="6"/>
    <!-- Center Sun Core -->
    <circle r="14" fill="url(#amber)"/>
    
    <!-- Clock Hands -->
    <path d="M 0 0 L 0 -16 M 0 0 L 10 6" stroke="#18120a" stroke-width="4" stroke-linecap="round"/>

    <!-- 8 Sun Rays -->
    <line x1="0" y1="-38" x2="0" y2="-32" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="32" x2="0" y2="38" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-38" y1="0" x2="-32" y2="0" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="0" x2="38" y2="0" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"/>
    
    <line x1="-26" y1="-26" x2="-22" y2="-22" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="26" y2="26" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-26" y1="26" x2="-22" y2="22" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="-22" x2="26" y2="-26" stroke="url(#amber)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
