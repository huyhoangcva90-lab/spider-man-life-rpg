<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081410"/>
      <stop offset="100%" stop-color="#030a08"/>
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33ebc3"/>
      <stop offset="50%" stop-color="#00e5b4"/>
      <stop offset="100%" stop-color="#009e7d"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#bg)"/>
  <rect width="124" height="124" x="2" y="2" rx="30" fill="none" stroke="url(#mint)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Emerald Gem & Trend Line -->
  <g transform="translate(64, 64)">
    <!-- Diamond Gem Outer -->
    <polygon points="0,-36 32,0 0,36 -32,0" fill="none" stroke="url(#mint)" stroke-width="4"/>
    <polygon points="0,-24 20,0 0,24 -20,0" fill="url(#mint)" opacity="0.3"/>
    
    <!-- Ascending Trendline -->
    <path d="M -22 10 L -6 -4 L 6 4 L 22 -14" fill="none" stroke="url(#mint)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="14,-14 22,-14 22,-6" fill="none" stroke="url(#mint)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
